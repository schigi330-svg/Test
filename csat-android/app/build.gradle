apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.xxxlutz.csat"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('../csat-release.keystore')
            storePassword 'xxxlutz2024'
            keyAlias 'csat-key'
            keyPassword 'xxxlutz2024'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    namespace 'com.xxxlutz.csat'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
